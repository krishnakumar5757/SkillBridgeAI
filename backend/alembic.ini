# =============================================================================
# SkillBridge AI — Alembic Configuration
# =============================================================================
# Alembic is used for database migrations. Run from the backend/ directory:
#   alembic init alembic          (already done)
#   alembic revision -m "msg"     (create a new migration)
#   alembic upgrade head          (apply migrations)
#   alembic downgrade -1          (rollback one migration)
# =============================================================================

[alembic]
# Path to the migration scripts
script_location = alembic

# Template for migration file names
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# Timezone for the file template
timezone = UTC

# Maximum length of slugified message
truncate_slug_length = 40

# Python path prepend (so app.* imports work)
prepend_sys_path = .

# Output encoding
output_encoding = utf-8


# =============================================================================
# Logging
# =============================================================================
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

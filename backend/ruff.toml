# =============================================================================
# SkillBridge AI — Ruff Configuration (Backend Linting & Formatting)
# =============================================================================
# Ruff is a fast Python linter and formatter that replaces flake8, black,
# and isort. This configuration satisfies the architecture's F-STACK-2
# recommendation for cross-agent code consistency.
# =============================================================================

target-version = "py311"
line-length = 100

[lint]
# Enable rule sets:
# - E/W: pycodestyle errors/warnings
# - F: pyflakes (unused imports, undefined names)
# - I: isort (import sorting)
# - N: pep8-naming
# - UP: pyupgrade (modernize syntax)
# - B: flake8-bugbear (common pitfalls)
# - SIM: flake8-simplify
# - RUF: ruff-specific rules
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM", "RUF"]

# Ignore B008 in route files — FastAPI's Depends() in argument defaults is
# the documented, correct pattern. We ignore it globally since it only
# appears in route handlers.
ignore = ["B008"]

[lint.per-file-ignores]
# Alembic env may have unused imports (autogenerated). F is selected, so this
# ignore is meaningful. (S101/BLE001 ignores for tests were removed: the S and
# BLE rule sets are not in `select` above, so those ignores were dead config.
# If S/BLE are added to `select` later, re-add the corresponding test ignores.)
"alembic/env.py" = ["F401"]

[format]
# Use double quotes for strings (consistent with the existing codebase)
quote-style = "double"
indent-style = "space"
